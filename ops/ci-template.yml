# Shared CI template for the programme's Python repos (Phase 2, hybrid).
# Copy this file into a repo as .github/workflows/test.yml and adapt ONLY
# the test path and smoke commands in the last two steps. Do not remove
# the Python matrix or the pytest step: the Phase 1 drift (stale test
# counts in READMEs) is only fixed if CI actually runs the suite on
# every push and the README points at CI instead of a hand-typed number.
#
# Already live in this shape: investment-analyst-toolkit,
# financial-research-analyst-agent (both: Tests run succeeded 28 Oct 2026).
# Added in Phase 2: nepali-capital-market-research (scanner suite).
# Not applicable to Markdown-only repos: for those, use ops/check_roster.py
# (agent pack) or a link check instead of pytest.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # ADAPT: point at this repo's test directory, e.g. tests/ or scanner/tests/
      - run: python -m pytest tests/ -q
      # ADAPT (optional): CLI smoke commands for this repo, e.g.
      # - run: python -m toolkit.cli predict
